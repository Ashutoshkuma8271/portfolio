<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="300" height="240">
  <defs>
    <!-- Multi-stop Metallic Gold Gradient for Ribbon -->
    <linearGradient id="goldRibbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FCEECB" />
      <stop offset="18%" stop-color="#E5C270" />
      <stop offset="45%" stop-color="#BF9132" />
      <stop offset="70%" stop-color="#DFB85C" />
      <stop offset="90%" stop-color="#A67B22" />
      <stop offset="100%" stop-color="#785310" />
    </linearGradient>

    <!-- Metallic Gold for Dark Theme Letters -->
    <linearGradient id="darkLetterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF1D1" />
      <stop offset="25%" stop-color="#DFB962" />
      <stop offset="55%" stop-color="#B8892D" />
      <stop offset="85%" stop-color="#DEB75D" />
      <stop offset="100%" stop-color="#805912" />
    </linearGradient>

    <!-- Rich Emerald Depth Gradient for Light Theme Letters -->
    <linearGradient id="emeraldLetterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E3329" />
      <stop offset="100%" stop-color="#071E17" />
    </linearGradient>

    <!-- Ribbon 3D Drop Shadow -->
    <filter id="ribbonDepth" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#030F0B" flood-opacity="0.38" />
    </filter>

    <!-- Subtle Bevel Highlight for Monogram -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#FFEBB3" flood-opacity="0.1" />
    </filter>
  </defs>

  <g transform="translate(48, 28)">
    <!-- ==================== LETTER Z ==================== -->
    <!-- Top Horizontal Bar with Left Serif -->
    <path d="M 6 36 
             C 4 28, 9 20, 18 18 
             L 94 18 
             C 98 18, 100 21, 100 25 
             L 100 35 
             L 45 35 
             L 98 114 
             L 98 126 
             L 2 126 
             C 0 126, -1 123, -1 120 
             L -1 110 
             L 56 110 
             L 6 36 Z" 
          fill="url(#emeraldLetterGrad)"
          stroke="none"
          stroke-width="0" />

    <!-- Top Left Serif Flare of Z -->
    <path d="M 6 36 C 4 48, 14 52, 22 52 L 22 42 C 16 42, 10 38, 6 36 Z" 
          fill="url(#emeraldLetterGrad)" />

    <!-- Bottom Right Serif of Z -->
    <path d="M 98 114 C 102 104, 94 98, 86 98 L 86 108 C 92 108, 96 111, 98 114 Z" 
          fill="url(#emeraldLetterGrad)" />

    <!-- ==================== LETTER K ==================== -->
    <!-- Vertical Column of K -->
    <path d="M 104 18 L 122 18 L 122 126 L 104 126 Z" 
          fill="url(#emeraldLetterGrad)"
          stroke="none"
          stroke-width="0" />

    <!-- Top & Bottom Serifs of K Column -->
    <path d="M 96 18 L 130 18 L 130 23 C 126 23, 122 25, 122 28 L 104 28 C 104 25, 100 23, 96 23 Z" 
          fill="url(#emeraldLetterGrad)" />
    <path d="M 96 126 L 130 126 L 130 121 C 126 121, 122 119, 122 116 L 104 116 C 104 119, 100 121, 96 121 Z" 
          fill="url(#emeraldLetterGrad)" />

    <!-- Upper Arm of K -->
    <path d="M 120 74 L 168 18 L 186 18 L 134 78 Z" 
          fill="url(#emeraldLetterGrad)"
          stroke="none"
          stroke-width="0" />
    <!-- Upper Arm Top Serif -->
    <path d="M 166 18 L 190 18 L 190 24 C 185 24, 180 27, 178 30 L 168 18 Z" 
          fill="url(#emeraldLetterGrad)" />

    <!-- Lower Leg of K with sweeping flourish -->
    <path d="M 125 70 
             C 134 70, 144 80, 154 94 
             L 178 126 
             L 198 126 
             L 168 86 
             C 158 74, 146 64, 134 64 
             Z" 
          fill="url(#emeraldLetterGrad)"
          stroke="none"
          stroke-width="0" />
    <!-- Lower Leg Foot -->
    <path d="M 172 126 L 202 126 L 202 121 C 196 121, 192 118, 188 114 L 178 126 Z" 
          fill="url(#emeraldLetterGrad)" />

    <!-- ==================== SIGNATURE 3D GOLDEN RIBBON ==================== -->
    <!-- Sweeps majestically from lower-left of Z, arcs across Z's diagonal,
         bridges over to K, and sweeps down-right with a graceful tapered tip -->
    <path d="M -8 104
             C 8 72, 38 48, 80 50
             C 114 52, 146 72, 168 100
             C 184 120, 202 130, 218 128
             C 198 132, 178 120, 158 98
             C 134 72, 108 59, 78 57
             C 44 55, 16 74, -8 104 Z"
          fill="url(#goldRibbon)"
          filter="url(#ribbonDepth)" />

    <!-- Delicate light highlight ridge along the upper crest of the ribbon -->
    <path d="M -2 98
             C 12 71, 40 50, 80 52
             C 112 54, 144 73, 166 100
             C 178 116, 194 125, 212 127
             C 196 126, 180 118, 166 102
             C 144 76, 114 58, 80 56
             C 42 54, 16 72, -2 98 Z"
          fill="#FFF6DF"
          opacity="0.35" />
  </g>
</svg>