
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="800" height="480">
  <defs>
    <!-- Gold Gradient for Ribbon -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B" />
      <stop offset="25%" stop-color="#D8B155" />
      <stop offset="55%" stop-color="#BF9032" />
      <stop offset="85%" stop-color="#E8C97A" />
      <stop offset="100%" stop-color="#8F681C" />
    </linearGradient>

    <!-- Metallic Gold for Dark Theme Letters -->
    <linearGradient id="goldLetter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="30%" stop-color="#E0BC69" />
      <stop offset="65%" stop-color="#B88A2E" />
      <stop offset="100%" stop-color="#845D14" />
    </linearGradient>

    <!-- Subtle Drop Shadow for Ribbon Depth -->
    <filter id="ribbonShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#051410" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Cinzel', 'Fraunces', Georgia, serif;
      font-weight: 700;
      letter-spacing: 0.26em;
    }
    .brand-tagline {
      font-family: 'Manrope', system-ui, sans-serif;
      font-weight: 600;
      letter-spacing: 0.28em;
      font-size: 8.5px;
    }
  </style>

  <!-- Background for testing light version -->
  <rect width="400" height="240" fill="#FAF7F2" />

  <g transform="translate(100, 10)">
    <!-- MONOGRAM GROUP (Centered at 100, so width is ~200, 0 to 200) -->
    
    <!-- Z Letterform (Deep Emerald #0C2B22) -->
    <!-- Top serif and bar -->
    <path d="M 28 32 L 88 32 L 88 41 L 49 41 L 89 97 L 89 106 L 22 106 L 22 97 L 65 97 L 28 42 Z" fill="#0C2B22" />
    <!-- Z serifs -->
    <path d="M 25 30 L 33 30 L 33 46 L 25 46 Z" fill="#0C2B22" />
    <path d="M 85 92 L 93 92 L 93 108 L 85 108 Z" fill="#0C2B22" />

    <!-- K Letterform (Deep Emerald #0C2B22) -->
    <!-- Vertical Stem -->
    <path d="M 98 28 L 112 28 L 112 110 L 98 110 Z" fill="#0C2B22" />
    <!-- Stem Top & Bottom Serifs -->
    <path d="M 93 28 L 117 28 L 117 33 L 93 33 Z" fill="#0C2B22" />
    <path d="M 93 105 L 117 105 L 117 110 L 93 110 Z" fill="#0C2B22" />

    <!-- Upper Arm -->
    <path d="M 112 68 L 152 28 L 164 28 L 123 73 Z" fill="#0C2B22" />
    <!-- Upper Arm Serif -->
    <path d="M 148 25 L 166 25 L 166 31 L 148 31 Z" fill="#0C2B22" />

    <!-- Lower Leg -->
    <path d="M 117 65 L 160 110 L 172 110 L 128 62 Z" fill="#0C2B22" />
    <!-- Lower Leg Foot Serif -->
    <path d="M 152 105 L 174 105 L 174 110 L 152 110 Z" fill="#0C2B22" />

    <!-- SIGNATURE GOLDEN SWOOP RIBBON (Arcs across Z and K) -->
    <path d="M 12 86 
             C 24 64, 48 48, 82 52 
             C 108 55, 134 72, 154 96 
             C 168 112, 182 120, 196 118 
             C 180 120, 162 110, 146 92 
             C 126 69, 102 59, 78 57 
             C 52 55, 30 68, 12 86 Z" 
          fill="url(#goldRibbon)" 
          filter="url(#ribbonShadow)" />
  </g>

  <!-- BRAND WORDMARK: ZEENAT KURESHI -->
  <text x="200" y="165" text-anchor="middle" class="brand-title" font-size="20" fill="#0C2B22">
    ZEENAT KURESHI
  </text>

  <!-- TAGLINE WITH ACCENT RULES -->
  <g transform="translate(0, 186)">
    <line x1="68" y1="-3" x2="114" y2="-3" stroke="#C79A3D" stroke-width="0.85" stroke-opacity="0.8" />
    <text x="200" y="0" text-anchor="middle" class="brand-tagline" fill="#8F681C">
      PEOPLE &nbsp;|&nbsp; PARTNERSHIPS &nbsp;|&nbsp; PROGRESS
    </text>
    <line x1="286" y1="-3" x2="332" y2="-3" stroke="#C79A3D" stroke-width="0.85" stroke-opacity="0.8" />
  </g>
</svg>
